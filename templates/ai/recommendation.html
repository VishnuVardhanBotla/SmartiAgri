{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="text-success">AI Recommendation Assistant</h3>
        <p class="text-muted">This starts with a practical rule-based engine and is designed to be upgraded later with ML.</p>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Crop</label>
            <input class="form-control" type="text" name="crop">
          </div>
          <div class="mb-3">
            <label class="form-label">Farm Size</label>
            <input class="form-control" type="text" name="farm_size">
          </div>
          <div class="mb-3">
            <label class="form-label">Soil Type</label>
            <input class="form-control" type="text" name="soil_type">
          </div>
          <div class="mb-3">
            <label class="form-label">Water Availability</label>
            <input class="form-control" type="text" name="water_availability">
          </div>
          <div class="mb-3">
            <label class="form-label">Budget</label>
            <input class="form-control" type="text" name="budget">
          </div>
          <div class="mb-3">
            <label class="form-label">Location</label>
            <input class="form-control" type="text" name="location">
          </div>
          <div class="mb-3">
            <label class="form-label">Season</label>
            <input class="form-control" type="text" name="season">
          </div>
          <button class="btn btn-success" type="submit">Generate Recommendation</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
