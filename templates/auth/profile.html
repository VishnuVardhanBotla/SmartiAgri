{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm">
  <div class="card-body">
    <h3 class="text-success">Profile</h3>
    <p><strong>Name:</strong> {{ user.full_name }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>
    <p><strong>Phone:</strong> {{ user.phone or 'Not provided' }}</p>
    <p><strong>Role:</strong> {{ user.role }}</p>
    <a class="btn btn-outline-success" href="{{ url_for('auth.change_password') }}">Change Password</a>
  </div>
</div>
{% endblock %}
