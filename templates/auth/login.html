{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-lg-5 col-xl-4">
    <div class="card auth-card">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="rounded-circle bg-success bg-opacity-10 d-inline-flex align-items-center justify-content-center p-3 mb-3">
            <i class="bi bi-person-circle fs-2 text-success"></i>
          </div>
          <h2 class="fw-bold text-success mb-2">{{ t('auth.welcome') }}</h2>
          <p class="text-muted mb-0">{{ t('auth.subtitle') }}</p>
        </div>
        <form method="post">
          <div class="mb-3 position-relative">
            <span class="input-icon"><i class="bi bi-envelope-fill"></i></span>
            <input type="text" class="form-control" name="login_input" placeholder="{{ t('auth.login_input') }}" required>
          </div>
          <div class="mb-4 position-relative">
            <span class="input-icon"><i class="bi bi-lock-fill"></i></span>
            <input type="password" class="form-control" name="password" placeholder="{{ t('auth.password') }}" required>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe">
              <label class="form-check-label small" for="rememberMe">{{ t('auth.remember') }}</label>
            </div>
            <a href="{{ url_for('auth.forgot_password') }}" class="small text-success">{{ t('auth.forgot') }}</a>
          </div>
          <button class="btn btn-success w-100" type="submit">{{ t('auth.login_button') }}</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
