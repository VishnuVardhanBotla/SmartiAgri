{% extends 'base.html' %}
{% block content %}
<div class="row">
  <div class="col-lg-8">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h3 class="text-success">Farmer Community</h3>
        <form method="post" action="{{ url_for('community.create_post') }}">
          <div class="mb-3">
            <input class="form-control" type="text" name="title" placeholder="Post title">
          </div>
          <div class="mb-3">
            <textarea class="form-control" name="content" placeholder="Share an update with the community"></textarea>
          </div>
          <button class="btn btn-success" type="submit">Create Post</button>
        </form>
      </div>
    </div>
    {% for post in posts %}
      <div class="card shadow-sm mb-3">
        <div class="card-body">
          <h5>{{ post.title }}</h5>
          <p>{{ post.content }}</p>
          <small>Posted by {{ post.full_name }}</small>
          <form class="mt-2" method="post" action="{{ url_for('community.add_comment', post_id=post.id) }}">
            <input class="form-control" type="text" name="comment_text" placeholder="Write a comment">
            <button class="btn btn-outline-success mt-2" type="submit">Comment</button>
          </form>
        </div>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
