{% extends 'base.html' %}
{% block content %}
<h3 class="text-success">Government Schemes</h3>
<p class="text-muted">Sample data is shown when official APIs are unavailable.</p>
<div class="row g-4 mt-2">
  {% for scheme in schemes %}
    <div class="col-md-6">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h5>{{ scheme.scheme_name }}</h5>
          <p>{{ scheme.description }}</p>
          <p><strong>Eligibility:</strong> {{ scheme.eligibility }}</p>
        </div>
      </div>
    </div>
  {% endfor %}
</div>
{% endblock %}
