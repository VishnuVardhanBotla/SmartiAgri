{% extends 'base.html' %}
{% block content %}
<h3 class="text-success">Machinery Marketplace</h3>
<div class="row g-4 mt-2">
  {% for item in machinery %}
    <div class="col-md-6">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h5>{{ item.name }}</h5>
          <p><strong>Provider:</strong> {{ item.provider_name }}</p>
          <p><strong>Location:</strong> {{ item.location }}</p>
          <p><strong>Rental Price/Day:</strong> ₹{{ item.rental_price_per_day }}</p>
          <a class="btn btn-outline-success" href="{{ url_for('machinery.details', machinery_id=item.id) }}">View Details</a>
        </div>
      </div>
    </div>
  {% endfor %}
</div>
{% endblock %}
